<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>—</title>
  <meta name="color-scheme" content="dark">
  <style>
    :root{
      --bg:#000; --card:#0b0b0b; --text:#e8eef6; --muted:#7f8a97; --accent:#6ae2b9;
    }
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font:16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      overflow:hidden;
    }
    /* Vignette + grain */
    body::before, body::after{
      content:""; position:fixed; inset:0; pointer-events:none;
    }
    body::before{
      background:radial-gradient(1200px 700px at 50% 40%, rgba(106,226,185,.08), transparent 60%),
                 radial-gradient(700px 500px at 20% 80%, rgba(106,226,185,.05), transparent 60%);
      mix-blend-mode:screen;
    }
    body::after{
      background:
        radial-gradient(120% 120% at 50% 40%, transparent 60%, rgba(0,0,0,.55) 100%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 2px);
      opacity:.85;
    }

    .wrap{min-height:100%; display:grid; place-items:center; padding:24px}
    .card{
      max-width:820px; width:100%;
      background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
      border:1px solid color-mix(in oklab, var(--muted), transparent 70%);
      border-radius:22px; padding:36px 30px 40px;
      box-shadow:0 25px 60px rgba(0,0,0,.65), inset 0 0 40px rgba(106,226,185,.03);
      backdrop-filter: blur(6px);
      position:relative;
    }
    .card::before{
      content:""; position:absolute; inset:-1px;
      border-radius:inherit;
      background:conic-gradient(from 220deg, transparent 0 60%, rgba(106,226,185,.15), transparent 80% 100%);
      filter:blur(12px); opacity:.6; z-index:-1;
    }

    .date{
      font-size:13px; color:var(--muted); letter-spacing:.3px;
      text-transform:uppercase; opacity:.85;
    }
    blockquote{
      margin:12px 0 0; font-size:clamp(22px,3.2vw,30px); font-weight:600;
      line-height:1.25; letter-spacing:.2px;
      text-shadow:0 0 12px rgba(106,226,185,.08);
    }
    .cursor{
      display:inline-block; width:.6ch; translate:0 .08em;
      border-bottom:2px solid var(--accent); margin-left:.2ch;
      animation:blink 1.3s steps(1) infinite;
    }
    @keyframes blink{50%{opacity:0}}

    /* subtle float */
    .float{animation:float 8s ease-in-out infinite}
    @keyframes float{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-6px)}
    }

    .hint{
      margin-top:18px; color:var(--muted); font-size:14px;
      opacity:.85;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card float" aria-live="polite">

      <div class="hint" id="hint" aria-hidden="true"></div>

function randomIndexNoRepeat(len, storageKey) {
  const used = new Set(JSON.parse(sessionStorage.getItem(storageKey) || "[]")
    .filter(i => Number.isInteger(i) && i >= 0 && i < len));
  if (used.size >= len) {
    used.clear(); // recomeça quando esgota
  }
  let idx;
  do { idx = Math.floor(Math.random() * len); } while (used.has(idx));
  used.add(idx);
  sessionStorage.setItem(storageKey, JSON.stringify([...used]));
  return idx;
}

function pickNoRepeat(array, storageKey) {
  if (!Array.isArray(array) || array.length === 0) return "";
  const idx = randomIndexNoRepeat(array.length, storageKey);
  return array[idx];
}

function formatDatePT(d){
  return new Intl.DateTimeFormat(document.documentElement.lang || 'pt-PT', {
    weekday: 'long', day: '2-digit', month: 'long'
  }).format(d);
}

(function init(){

  const [frase, extra] = chosen.split("|").map(s => s.trim());

  outHint.textContent   = extra;
  outDate.textContent   = formatDatePT(today);
})();
