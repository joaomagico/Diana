<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio – Diana</title>
  <meta name="color-scheme" content="dark">
  <style>
  .home-wrap {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 30;
}

.home-btn {
  display:block; padding:10px 16px;
  background:rgba(255,255,255,.02);
  border:1px solid color-mix(in oklab, var(--muted), transparent 65%);
  border-radius:12px;
  color:var(--text); text-decoration:none;
  font-weight:500; font-size:15px;
  transition:.25s;
  opacity:.7;
}
.home-btn:hover,
.home-btn:active {
  border-color:var(--accent);
  color:var(--accent);
  background:rgba(106,226,185,.08);
  transform:translateY(-2px);
  opacity:1;
}

    :root{
      --bg:#000; --card:#0b0b0b; --text:#e8eef6; --muted:#7f8a97; --accent:#6ae2b9;
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      background:var(--bg); color:var(--text);
      background-attachment:fixed; overflow-x:hidden;
    }
    /* vignette + grain */
    body::before, body::after{
      content:""; position:fixed; inset:0; pointer-events:none;
    }
    body::before{
      background:radial-gradient(1200px 700px at 50% 40%, rgba(106,226,185,.08), transparent 60%),
                 radial-gradient(700px 500px at 20% 80%, rgba(106,226,185,.05), transparent 60%);
      mix-blend-mode:screen;
    }
    body::after{
      background:
        radial-gradient(120% 120% at 50% 40%, transparent 60%, rgba(0,0,0,.55) 100%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 2px);
      opacity:.85;
    }

    header{
      padding:2rem 1rem 1.2rem; text-align:center;
    }
    header h1{
      margin:0; font-weight:700;
      font-size:clamp(1.6rem,2.8vw,2.2rem);
      text-shadow:0 0 18px rgba(106,226,185,.1);
    }

    .wrap{max-width:1200px; margin:0 auto; padding:0 1rem 3rem}

    h2{
      margin:2.2rem 0 1rem; font-size:1rem; font-weight:600; letter-spacing:.04em;
      color:var(--muted); text-transform:uppercase;
    }

    .grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); /* antes era 220px */
  gap: 1.2rem; /* ligeiramente maior espaçamento */
}



    .card{
      display:block; background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.01));
      border:1px solid color-mix(in oklab, var(--muted), transparent 70%);
      border-radius:var(--radius); text-decoration:none; color:inherit;
      overflow:hidden; transition:.25s; position:relative;
      box-shadow:0 12px 30px rgba(0,0,0,.4), inset 0 0 30px rgba(106,226,185,.02);
      backdrop-filter:blur(6px);
    }
    .card:hover{
      border-color:var(--accent); transform:translateY(-4px);
      box-shadow:0 20px 40px rgba(0,0,0,.55), inset 0 0 40px rgba(106,226,185,.04);
    }

    .thumb {
  position: relative;
  aspect-ratio: 9/9; /* mais largo e moderno (antes 16/10) */
  width: 100%;
  overflow: hidden;
  background: radial-gradient(80% 80% at 50% 20%, #1a2130 0%, #0e1118 70%);
}

    .thumb::after{
      content:""; position:absolute; inset:0;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.03), inset 0 -30px 40px rgba(0,0,0,.25);
      pointer-events:none;
    }
    .thumb img{
      width:100%; height:100%; object-fit:cover; display:block;
      transform:translateZ(0); transition:transform .45s ease, filter .3s ease;
    }
    .card:hover .thumb img{transform:scale(1.06); filter:saturate(1.05) contrast(1.02)}

    /* reflexo */
    .reflect::after{
      content:""; position:absolute; bottom:-45%; left:0; width:100%; height:100%;
      background:inherit; transform:scaleY(-1);
      opacity:.15; filter:blur(3px); pointer-events:none;
    }

    .title{
      padding:.9rem 1rem 1.05rem; font-weight:600;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      letter-spacing:.01em;
    }

    .placeholder{
      width:100%; height:100%; display:grid; place-items:center;
      color:#8e98ad; font-size:.9rem;
      background:linear-gradient(135deg,#141923 0%,#151c26 40%,#1a2333 100%);
      position:relative; overflow:hidden;
    }
    .placeholder::before{
      content:""; position:absolute; inset:0;
      background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.07) 50%,transparent 100%);
      transform:translateX(-100%); animation:shimmer 1.8s infinite;
    }
    @keyframes shimmer{100%{transform:translateX(100%)}}
  </style>
  <script src="token-check.js"></script>
</head>
<body>
<header><h1>Portfolio – Diana</h1></header>
<main class="wrap" id="app"></main>

<script>
  const grupos = [
    {
      nome: "Filmes",
      pastas: ["o que ha de novo no amor","Imortal","A Morte de Carlos Gardel","Avaliacao","E amanha","Luto Branco","Couples","Plano de Fuga","Flumen","Ilhas do Triangulo","Curral"]
    },
    {
      nome: "Teatro",
      pastas: ["Teatro/O Pelicano","Teatro/e nao se pode extermina-lo","Teatro/Ernesto","Teatro/Romeu e Julieta","Teatro/Esperando Diana","Teatro/tudo bem","Teatro/As Raposas","Teatro/Vou levar-te comigo","Teatro/Uma casa de bonecas","Teatro/Desconfortavel","Teatro/Swing"]
    },
    {
      nome: "TV",
      pastas: ["TV/Queridos papas","TV/Vizinhos","TV/Novas Narrativas","TV/Salto de fe","TV/FELP"]
    }
  ];

  function capaComFallback(path){
    const img=new Image();
    const exts=["jpg","png"]; let i=0;
    img.alt=`Capa de ${path.split('/').pop()}`;
    img.loading="lazy"; img.decoding="async"; img.fetchPriority="low";
    img.sizes="(min-width: 1100px) 240px, (min-width: 700px) 33vw, 50vw";
    img.src=encodeURI(`${path}/capa.${exts[i]}`);
    img.onerror=function(){
      i++; if(i<exts.length){ img.src=encodeURI(`${path}/capa.${exts[i]}`); }
      else{
        const ph=document.createElement("div");
        ph.className="placeholder"; ph.textContent="sem capa"; img.replaceWith(ph);
      }
    };
    return img;
  }

  function criarCard(path){
    const a=document.createElement("a");
    a.className="card";
    const lower=path.toLowerCase();
    if(!lower.includes("novas narrativas") && !lower.includes("para sempre") &&
       !lower.includes("morango") && !lower.includes("mar salgado") &&
       !lower.includes("loveit") && !lower.includes("pelicano") &&
       !lower.includes("extermina") && !lower.includes("deixa que te leve") &&
       !lower.includes("ilha dos amores")){
      a.href=encodeURI(`${path}/index.html?token=Q15qxgcvQImhc1uDYwUIycyK5L3D01AW5cihRTzr3ViTxuVVWv8F13soryEYcYHV`);
    }
    const thumb=document.createElement("div");
    thumb.className="thumb";
    if(Math.random()>0.5){thumb.classList.add("reflect")}
    thumb.appendChild(capaComFallback(path));
    const title=document.createElement("div");
    title.className="title"; title.textContent=path.split("/").pop();
    a.appendChild(thumb); a.appendChild(title);
    return a;
  }

  const app=document.getElementById("app");
  grupos.forEach(grupo=>{
    const h2=document.createElement("h2");
    h2.textContent=grupo.nome;
    const grid=document.createElement("section");
    grid.className="grid";
    grupo.pastas.forEach(p=>grid.appendChild(criarCard(p)));
    app.appendChild(h2); app.appendChild(grid);
  });
</script>
<div class="home-wrap">
  <a href="index.html?token=Q15qxgcvQImhc1uDYwUIycyK5L3D01AW5cihRTzr3ViTxuVVWv8F13soryEYcYHV" target="_blank" class="home-btn">Home</a>
</div>
</body>
</html>
